# ---------- Microservicio de usuarios ----------
spring.application.name=ms-usuarios
server.port=8081

# ---------- Base de datos MySQL (Laragon) ----------
# La base vsm_usuarios se crea sola la primera vez (createDatabaseIfNotExist=true)
spring.datasource.url=jdbc:mysql://localhost:3306/vsm_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate crea y actualiza las tablas a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# La misma clave secreta va en los 3 microservicios (mínimo 32 caracteres)
jwt.secreto=${JWT_SECRETO:mHZ8v5iZ5idlhaz-d-CwOVdPdb2c_I10rwVoXZUj5r-PU1e_LW6VL5VSeey_Tduc}
jwt.minutos-acceso=15
jwt.dias-renovacion=7

# ---------- Orígenes autorizados (CORS) ----------
# El frontend normalmente entra por el gateway (8080); 5173 permite llamarlo directo
# y 8080 permite probar los endpoints desde el Swagger unificado del gateway.
app.cors.origenes=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080

# ---------- Eureka: se registra con su nombre (spring.application.name) ----------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.lease-renewal-interval-in-seconds=5

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
